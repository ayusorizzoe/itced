<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Slider</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            font-family: system-ui, sans-serif;
            color: #f2f2f2;
        }

        .volume-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: min(400px, 60vw);
            height: 6px;
            border-radius: 3px;
            background: #f2f2f2;
            box-shadow: 0 0 8px rgba(242, 242, 242, 0.9), 0 0 20px rgba(242, 242, 242, 0.5);
            opacity: 1;
            outline: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f2f2f2;
            box-shadow: 0 0 8px #f2f2f2, 0 0 24px rgba(242, 242, 242, 0.6);
        }

        #volume-slider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #f2f2f2;
        }

        #volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: #f2f2f2;
            box-shadow: 0 0 10px #f2f2f2, 0 0 24px rgba(242, 242, 242, 0.6);
        }

        #volume-value {
            text-shadow: 0 0 8px rgba(242, 242, 242, 0.8);
            color: #f2f2f2;
        }

        #start-btn {
            flex: none;
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #f2f2f2;
            border: 1px solid #f2f2f2;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(242, 242, 242, 0.5);
        }

        #start-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #start-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>
    <audio id="audio-player" src="crowd.mp3"></audio>

    <div class="volume-container">
        <div class="controls">
            <button id="start-btn" aria-label="Play">
                <svg viewBox="0 0 24 24" aria-hidden="true"> 
                    <path d="M6 4l14 8-14 8z"></path>
                </svg>
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" disabled>
        </div>
        <span id="volume-value">100%</span>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        const startBtn = document.getElementById('start-btn');

        audio.volume = 1; // Set initial volume to 100%

        const quietT = 0.20;
        const screamM = 0.80;
        const recovery = 0.002;

        let currentVolume = 1;

        function setVolume(v) {
            currentVolume = Math.min(1, Math.max(0, v));
            audio.volume = currentVolume;
            volumeSlider.value = currentVolume;
            volumeValue.textContent = `${Math.round(currentVolume * 100)}%`;
        }

        startBtn.addEventListener('click', async () => {
            const cntx = new AudioContext();
            await cntx.resume();

            const stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            const source = cntx.createMediaStreamSource(stream);
            const analyser = cntx.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);
            const buff = new Float32Array(analyser.fftSize);

            audio.play();
            startBtn.disabled = true;

            function tick() {
                analyser.getFloatTimeDomainData(buff);

                let total = 0;
                for (const s of buff) total += Math.abs(s);
                const loudness = total / buff.length;

                const scream = Math.min(1, Math.max(0, (loudness - quietT) / (screamM - quietT)));
                const target = 1 - scream;

                if (target < currentVolume) {
                    setVolume(target);
                } else {
                    setVolume(currentVolume + recovery);
                }
                requestAnimationFrame(tick);
            }
            tick();
        });
    </script>
</body>

</html>
